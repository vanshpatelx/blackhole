name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  dmg:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Build DMG
        run: VERSION="${GITHUB_REF_NAME#v}" ./scripts/make-dmg.sh
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          # BlackHole.dmg is a stable filename, so the website can always link to the newest build.
          cp "dist/BlackHole-$VERSION.dmg" dist/BlackHole.dmg
          ASSETS=("dist/BlackHole-$VERSION.dmg" "dist/BlackHole-$VERSION.dmg.sha256" "dist/BlackHole.dmg")
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            # Release was created by hand; attach the CI-built DMG to it.
            gh release upload "$GITHUB_REF_NAME" "${ASSETS[@]}" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "${ASSETS[@]}" \
              --title "Black Hole $VERSION" --generate-notes
          fi
