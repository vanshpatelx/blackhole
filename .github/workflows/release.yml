name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  dmg:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Build DMG
        run: VERSION="${GITHUB_REF_NAME#v}" ./scripts/make-dmg.sh
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" \
            "dist/BlackHole-$VERSION.dmg" "dist/BlackHole-$VERSION.dmg.sha256" \
            --title "Black Hole $VERSION" --generate-notes
